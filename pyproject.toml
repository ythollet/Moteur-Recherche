[project]
name = "moteurrecherche"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "arxiv>=4.0.1",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "pandas-stubs~=3.0.5",
    "pdfplumber>=0.11.10",
    "praw>=8.0.3",
    "python-dotenv>=1.2.3",
    "scipy>=1.18.1",
    "scipy-stubs~=1.18.1",
    "xmldict>=0.4.1",
    "xmltodict>=1.0.4",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
]
